# ADR-036: Gitea Container Registry. latest 태그는 운영 배포 금지 —
# CI가 커밋 SHA로 태깅하므로 배포 시 --set image.tag=<SHA>로 갱신한다.
# (공개 사본이라 레지스트리 주소/조직명은 placeholder로 치환됨)
#
# image.repository는 gitea.infra.svc.cluster.local(내부 Service DNS)이 아니라 게이트웨이
# 외부 주소(registry.example.com)를 쓴다 — kubelet/containerd의 이미지 pull은 호스트 네트워크에서
# 일어나 CoreDNS를 못 타므로 *.svc.cluster.local을 못 resolve한다(파드 안에서 도는 nginx의
# BACKEND_HOST 프록시와는 다른 경로). 노드 containerd에도 이 host:port를 insecure registry로
# 등록해뒀다(k8s-manager 배포 때와 동일하게 /etc/containerd/certs.d/registry.example.com/hosts.toml).
image:
  repository: registry.example.com/org/monitoring-web
  tag: v1.3.0
  pullPolicy: IfNotPresent
  # 저장소가 private이라 pull 인증이 필요하다. k8s-manager 배포 때 이미 만들어둔
  # dockerconfigjson Secret(infra 네임스페이스)을 그대로 재사용한다 — 새로 안 만들어도 됨.
  pullSecretName: gitea-registry-cred

replicaCount: 1

# k8s_manager의 k8s/values.yaml (gateway.guiServiceName/guiServicePort)이 이 이름/포트로
# HTTPRoute backendRef를 걸어두고 있으므로, 임의로 바꾸면 라우팅이 끊어진다.
service:
  name: local-ops-gui-svc
  port: 80
  targetPort: 8080

# nginx.conf.template의 ${BACKEND_HOST}를 채운다 — k8s_manager Service(k8s/templates/service.yaml
# 참고: k8s-manager-svc, namespace infra, port 8000)를 가리킨다.
config:
  BACKEND_HOST: "k8s-manager-svc.infra.svc.cluster.local:8000"

# ADR-004: GUI(monitoring-web)는 관리서버(k8s_manager)와 같은 namespace(infra) 안의
# 별도 Pod/Deployment/Service로 배포하기로 결정됨 — 소스는 분리, 배포 단위는 함께 묶어 관리.
#
# ADR-005: 확정됨 — "/"는 Gitea HTTPRoute가 이미 점유하고 있어 이 GUI는 /dashboard 경로로
# 노출한다(k8s_manager/k8s/values.yaml의 gateway.guiPathPrefix). vite.config.js의 base와
# nginx.conf.template이 이 경로를 기준으로 자산/라우팅을 처리하도록 맞춰져 있다.
#
# ADR-006(TLS 발급 주체)/ADR-008(외부 노출 포트)/ADR-030(Gateway 외부 IP)은 아직 대기 중이라,
# 이 저장소에는 Gateway/HTTPRoute 자체는 만들지 않았다 — k8s_manager 쪽 차트의
# gateway.exposeGui=true로 전환하고 이 Service(local-ops-gui-svc)를 가리키면 된다.
