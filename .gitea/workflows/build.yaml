name: build-and-push
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login registry.example.com -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build and push
        run: |
          docker build --build-arg GIT_SHA=${{ gitea.sha }} -t registry.example.com/org/monitoring-web:${{ gitea.sha }} .
          docker push registry.example.com/org/monitoring-web:${{ gitea.sha }}
